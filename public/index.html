    <!-- Animated ZenVerse Favicon -->
    <link id="favicon" rel="icon" href="%PUBLIC_URL%/assets/erp.png" type="image/png" />
    <link id="apple-favicon" rel="apple-touch-icon" href="%PUBLIC_URL%/assets/erp.png" />
    <script>
      (function() {
        var icons = [
          '/assets/erp.png',
          '/assets/crm.png',
          '/assets/app.png',
          '/assets/web.png',
          '/assets/whitelable.png'
        ];
        var currentIndex = 0;
        
        setInterval(function() {
          currentIndex = (currentIndex + 1) % icons.length;
          var newIconUrl = '%PUBLIC_URL%' + icons[currentIndex];
          
          var favicon = document.getElementById('favicon');
          var appleFavicon = document.getElementById('apple-favicon');
          
          if (favicon) {
            favicon.href = newIconUrl;
          }
          if (appleFavicon) {
            appleFavicon.href = newIconUrl;
          }
        }, 2000); // Change icon every 2 seconds
      })();
    </script>
